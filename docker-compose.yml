services:
  app:
    build: .
    volumes:
      - ./data:/app/data
      - ./results:/app/results
      - ./configs:/app/configs:ro

  dev:
    profiles: ["dev"]
    build: .
    volumes:
      - ./data:/app/data
      - ./results:/app/results
      - ./configs:/app/configs:ro
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
