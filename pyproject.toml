[project]
name = "tcc"
version = "0.1.0"
description = "Predictive cloud autoscaling: neural-network workload forecasting vs. classical methods to cut operating cost under SLA constraints."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gabriel Lobo de Sant Anna Rosas", email = "gabrielsrosas@gmail.com" }]
keywords = [
    "autoscaling",
    "cloud-computing",
    "resource-allocation",
    "workload-forecasting",
    "time-series-forecasting",
    "deep-learning",
    "gru",
    "arima",
    "holt-winters",
    "simulation",
    "sla",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
]
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "duckdb",
    "scipy",
    "statsmodels",
    "matplotlib",
]

[project.urls]
Homepage = "https://github.com/gabriellsar/predictive-cloud-autoscaling"
Repository = "https://github.com/gabriellsar/predictive-cloud-autoscaling"
Issues = "https://github.com/gabriellsar/predictive-cloud-autoscaling/issues"

[dependency-groups]
dev = ["pytest", "ruff", "ipykernel"]

nn = ["torch"]

# PyTorch só para CPU: o índice explícito é usado apenas pelo torch, o resto vem do PyPI.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tcc"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I"]
