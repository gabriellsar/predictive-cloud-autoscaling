[project]
name = "tcc"
version = "0.1.0"
description = "Alocação preditiva de recursos em nuvem via previsão de carga (Projeto Final)"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "duckdb",
    "scipy",
    "statsmodels",
    "matplotlib",
]

[dependency-groups]
dev = ["pytest", "ruff", "ipykernel"]

nn = ["torch"]

# PyTorch só para CPU: o índice explícito é usado apenas pelo torch, o resto vem do PyPI.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tcc"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I"]
